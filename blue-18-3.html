x 0}.source-reader .reader-content{padding:0 12px 12px}.source-reader iframe{display:block;width:100%;height:clamp(420px,75vh,850px);border:1px solid #344254;border-radius:6px;background:#fff}.list-tools{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}button{font:inherit;color:#c6dfff;background:#1e3045;border:1px solid #52647b;border-radius:6px;padding:6px 12px;cursor:pointer}summary:focus-visible,button:focus-visible{outline:2px solid #a8d1ff;outline-offset:2px}.post-toggle[open]>summary{background:#202c3c}.reader-note{font-size:13px;color:#b6c8dc}.post-meta-block{min-width:0}.post-meta-block .meta{margin-top:3px}@media(max-width:600px){.post-toggle>summary{padding:10px}.post-title{font-size:15px}.source-reader iframe{height:600px}}.post-content h3{font-size:15px;color:#c6dfff;margin:12px 0 4px}.source-links a{display:inline-block;padding:6px 0}.post-content p{overflow-wrap:anywhere}</style></head><body><script>if(new URLSearchParams(location.search).get("embed")==="1")document.documentElement.classList.add("embedded");</script><main><nav><a href="index.html">← 返回公會資料庫</a><a href="https://worldofwarcraft.blizzard.com/zh-tw/news/24315281" target="_blank" rel="noopener noreferrer">暴雪官方繁中熱修全文</a></nav><h1>永恆官方藍帖</h1><p>V18.3｜繁體中文公告整理｜單則展開閱讀（無嵌入框）</p><div id="live-source"></div><section class="panel"><p class="muted">公會選錄核對日期：2026/11/27。每篇公告預設收合，點擊標題閱讀繁中摘要。EXWIND 原站不支援本站內嵌閱讀，完整譯文請使用原文連結；本站非即時同步。</p><nav><a href="https://worldofwarcraft.blizzard.com/zh-tw/news/24315281" target="_blank" rel="noopener noreferrer">官方繁中完整熱修正</a><a href="https://us.forums.blizzard.com/en/wow/t/wow-forever-hotfixes-november-25-2026/2403040/1" target="_blank" rel="noopener noreferrer">官方英文討論串</a><a href="https://exwind.net/zhTW/blue/forever/" target="_blank" rel="noopener noreferrer">EXWIND 繁中藍帖完整列表</a></nav></section><section class="panel filters"><label>搜尋公告<input id="q" type="search" placeholder="職業、技能、日期"></label><label>分類<select id="category"><option value="">全部</option><option>職業</option><option>團本與物品</option><option>客服與系統</option><option>練等</option><option>戰場</option><option>專業與附魔</option></select></label></section><p class="muted">點選單則標題展開，再點一次收合。</p><p id="count" class="muted" role="status"></p><div id="posts"></div><footer class="muted">墓鐘公會用資料庫・非官方網站。翻譯摘要及遊戲名詞仍可能需核對。</footer></main><script>const posts=[{"key":"203","date":"2026-11-25","title":"線上修正－11月25日","author":"Kaivax","translated":"https://exwind.net/zhTW/post/blue/203/","url":"https://us.forums.blizzard.com/en/wow/t/wow-forever-hotfixes-november-25-2026/2403040/1","sections":[{"category":"職業","title":"德魯伊、獵人及術士修正","body":"颶風最後一次傷害正常結算；修正獵人與術士寵物普通近戰爆擊率異常。平衡德魯伊天賦調整請參閱完整官方原文。"},{"category":"團本與物品","title":"地城與裝備修正","body":"哈卡的化身生成問題已修復，黑劍 Blackblade of Shahram 的加速增益只給武器持有人；律法聖契現可影響命令審判。"},{"category":"專業與附魔","title":"揭露附魔觸發修正","body":"範圍法術改成每波判定一次，而非每個目標分別觸發；引導法術不再全程受到該附魔影響。"}]},{"key":"194","date":"2026-11-23","title":"線上修正－11月23日","author":"Kaivax","translated":"https://exwind.net/zhTW/post/blue/194/","url":"https://news.blizzard.com/en-us/article/24315281/wow-forever-hotfixes-november-23-2026","sections":[{"category":"團本與物品","title":"世界增益與武器觸發","body":"切換區域不再移除世界增益，進入團本仍會移除。修正部分技能造成過多武器觸發的問題。"},{"category":"專業與附魔","title":"烹飪、工程與製皮修正","body":"數種蚌肉料理的進食效果及分類已校正；工程學迫擊砲重載配方與部分製皮圖樣的學習問題修復。"},{"category":"職業","title":"野性德魯伊套裝與其他職業修正","body":"Feralheart 四件套裝修正為5秒內每秒恢復4點能量；另有暗影牧師、毀滅術士及致死打擊天賦修正。"}]},{"key":"192","date":"2026-11-20","title":"線上修正－11月20日","author":"Kaivax","translated":"https://exwind.net/zhTW/post/blue/192/","url":"https://us.forums.blizzard.com/en/wow/t/wow-forever-hotfixes-november-25-2026/2403040/1","sections":[{"category":"職業","title":"戰鬥盜賊及惡魔術士","body":"戰鬥盜賊的戳刺可透過劍刃亂舞攻擊另一目標；取消惡魔庇護天賦後不再保留效果。每小時同一地城最多重置進入5次；雷暴三件套回能改為3%機率恢復18點。"}]},{"key":"190","date":"2026-11-19","title":"線上修正－11月19日","author":"Kaivax","translated":"https://exwind.net/zhTW/post/blue/190/","url":"https://news.blizzard.com/en-us/article/24315281/wow-forever-hotfixes-november-19-2026","sections":[{"category":"職業","title":"懲戒騎士雙手武器專精","body":"裝備雙手武器時，雙手武器專精正確強化所有神聖傷害。"}]},{"key":"179","date":"2026-11-13","title":"線上修正－11月13日","author":"Kaivax","translated":"https://exwind.net/zhTW/post/blue/179/","url":"https://us.forums.blizzard.com/en/wow/t/wow-forever-hotfixes-november-25-2026/2403040/1","sections":[{"category":"職業","title":"命令審判及風怒圖騰","body":"命令審判計為近戰攻擊，其他審判仍為遠程攻擊。風怒圖騰的近戰技能觸發規則修正，副手打擊不觸發。"},{"category":"職業","title":"恢復德魯伊、法師及聖騎士熱修","body":"野性痊癒不再允許移動施法，治療係數調高至6.6%；冰霜新星的傷害解除規則修正；命令審判按近戰攻擊處理。"}]},{"key":"local-5","date":"2026-11-13","title":"技能訓練費用退款","author":"Kaivax","translated":null,"url":null,"sections":[{"category":"客服與系統","title":"技能訓練費用退款","body":"受11月9日伺服器異常影響而遺失已購技能的玩家，可檢查遊戲信箱是否收到退款。"}]},{"key":"local-7","date":"2026-11-10","title":"拍賣場最低寄售金額調整","author":"Kaivax","translated":null,"url":null,"sections":[{"category":"客服與系統","title":"拍賣場最低寄售金額調整","body":"最低寄售金額下調至1銅幣，另修正部分郵件寄件人及送達時間異常。"}]},{"key":"local-8","date":"2026-11-08","title":"地城擊殺經驗值提高","author":"Kaivax","translated":null,"url":null,"sections":[{"category":"練等","title":"地城擊殺經驗值提高","body":"地城擊殺經驗值較先前提高50%。"}]},{"key":"199","date":"2026-11-25","title":"平衡德魯伊調整－11月25日","author":"Kaivax","translated":"https://exwind.net/zhTW/post/blue/199/","url":null,"sections":[{"category":"職業","title":"平衡德魯伊天賦重整","body":"強化星火術上限降至2點，月怒改為夢境；梟獸形態增加10%秘法與自然傷害。舊版配點須重新核對，尤其曾投入3點以上強化星火術的角色。"}]},{"key":"202","date":"2026-11-25","title":"奧特蘭克山谷調整－11月25日","author":"Kaivax","translated":"https://exwind.net/zhTW/post/blue/202/","url":null,"sections":[{"category":"戰場","title":"奧特蘭克山谷目標與聲望調整","body":"長時間對戰的額外聲望門檻改為20分鐘；擊敗中尉、佔領墓地及礦坑的聲望獎勵提高。"}]}];const q=document.getElementById("q"),c=document.getElementById("category"),out=document.getElementById("posts");
const SOURCE="https://exwind.net/zhTW/blue/forever/";
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function external(text,url){const a=el("a",text);a.href=url;a.target="_blank";a.rel="noopener noreferrer";return a;}
const sourceBox=el("div",undefined,"source-links");
sourceBox.append(external("EXWIND 永恆服最新藍帖",SOURCE),external("EXWIND 全部藍帖","https://exwind.net/zhTW/blue/?game=all"));
document.getElementById("live-source").append(sourceBox);
const expanded=new Set();
function draw(){
 // Capture the current state before replacing nodes; toggle events are asynchronous.
 for(const d of out.querySelectorAll(".post-toggle")){if(d.open)expanded.add(d.dataset.postKey);else expanded.delete(d.dataset.postKey);}
 out.replaceChildren();
 const terms=q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
 const list=posts.slice().sort((a,b)=>b.date.localeCompare(a.date)).filter(p=>(!c.value||p.sections.some(s=>s.category===c.value))&&terms.every(t=>[p.title,p.date,p.author,...p.sections.flatMap(s=>[s.title,s.body,s.category])].join(" ").toLowerCase().includes(t)));
 document.getElementById("count").textContent="顯示 "+list.length+" 篇公告";
 for(const p of list){
  const a=el("article"),d=el("details",undefined,"post-toggle"),head=el("summary"),avatar=el("span","藍","blue-avatar"),metaBlock=el("div",undefined,"post-meta-block");
  d.dataset.postKey=p.key;
  const categories=[...new Set(p.sections.map(s=>s.category))].join("／");
  metaBlock.append(el("div",p.title,"post-title"),el("div","永恆服 · "+p.date+" · "+categories+(p.author?" · "+p.author:""),"meta"));head.append(avatar,metaBlock);
  const content=el("div",undefined,"post-content"),links=el("div",undefined,"source-links");
  content.append(el("p","公會繁中重點整理（非官方全文）","source-label"));
  for(const section of p.sections){content.append(el("h3",section.title),el("p",section.body));}
  if(p.translated)links.append(external("閱讀 EXWIND 繁中全文 ↗",p.translated));else links.append(external("EXWIND 永恆藍帖列表 ↗",SOURCE));
  if(p.url)links.append(external("閱讀官方原文 ↗",p.url));
  content.append(links);d.append(head,content);d.open=expanded.has(p.key);
  d.addEventListener("toggle",()=>{if(!d.isConnected)return;if(d.open)expanded.add(p.key);else expanded.delete(p.key);});
  a.append(d);out.append(a);
 }
 if(!list.length)out.append(el("p","沒有符合搜尋的公告。"));
}
q.oninput=c.onchange=draw;draw();</script></body></html>
