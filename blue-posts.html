s.blizzard.com/en/wow/t/wow-forever-hotfixes-november-25-2026/2403040/1" target="_blank" rel="noopener noreferrer">官方英文討論串</a><a href="https://exwind.net/zhTW/blue/forever/" target="_blank" rel="noopener noreferrer">EXWIND 繁中藍帖完整列表</a></nav></section><section class="panel filters"><label>搜尋公告<input id="q" type="search" placeholder="職業、技能、日期"></label><label>分類<select id="category"><option value="">全部</option><option>職業</option><option>團本與物品</option><option>客服與系統</option><option>練等</option><option>戰場</option><option>專業與附魔</option></select></label></section><p id="count" class="muted" role="status"></p><div id="posts"></div><footer class="muted">墓鐘公會用資料庫・非官方網站。翻譯摘要及遊戲名詞仍可能需核對。</footer></main><script>const posts=[{"date":"2026-11-25","category":"職業","title":"德魯伊、獵人及術士修正","body":"颶風最後一次傷害正常結算；修正獵人與術士寵物普通近戰爆擊率異常。平衡德魯伊天賦調整請參閱完整官方原文。","url":"https://us.forums.blizzard.com/en/wow/t/wow-forever-hotfixes-november-25-2026/2403040/1","translated":"https://exwind.net/zhTW/post/blue/203/","author":"Kaivax"},{"date":"2026-11-23","category":"團本與物品","title":"世界增益與武器觸發","body":"切換區域不再移除世界增益，進入團本仍會移除。修正部分技能造成過多武器觸發的問題。","url":"https://news.blizzard.com/en-us/article/24315281/wow-forever-hotfixes-november-23-2026","translated":"https://exwind.net/zhTW/post/blue/194/","author":"Kaivax"},{"date":"2026-11-20","category":"職業","title":"戰鬥盜賊及惡魔術士","body":"劍刃亂舞可使 Shank 傷害命中額外目標；修正惡魔庇護洗掉後仍保留增益的問題。","url":"https://us.forums.blizzard.com/en/wow/t/wow-forever-hotfixes-november-25-2026/2403040/1"},{"date":"2026-11-19","category":"職業","title":"懲戒騎士雙手武器專精","body":"裝備雙手武器時，雙手武器專精正確強化所有神聖傷害。","url":"https://news.blizzard.com/en-us/article/24315281/wow-forever-hotfixes-november-19-2026"},{"date":"2026-11-13","category":"職業","title":"命令審判及風怒圖騰","body":"命令審判計為近戰攻擊，其他審判仍為遠程攻擊。風怒圖騰的近戰技能觸發規則修正，副手打擊不觸發。","url":"https://us.forums.blizzard.com/en/wow/t/wow-forever-hotfixes-november-25-2026/2403040/1"},{"date":"2026-11-13","category":"客服與系統","title":"技能訓練費用退款","body":"受11月9日伺服器異常影響而遺失已購技能的玩家，可檢查遊戲信箱是否收到退款。","author":"Kaivax","translated":"https://exwind.net/zhTW/blue/?game=all"},{"date":"2026-11-13","category":"職業","title":"恢復德魯伊、法師及聖騎士熱修","body":"野性痊癒不再允許移動施法，治療係數調高至6.6%；冰霜新星的傷害解除規則修正；命令審判按近戰攻擊處理。","author":"Kaivax","translated":"https://exwind.net/zhTW/post/blue/179/"},{"date":"2026-11-10","category":"客服與系統","title":"拍賣場最低寄售金額調整","body":"最低寄售金額下調至1銅幣，另修正部分郵件寄件人及送達時間異常。","author":"Kaivax","translated":"https://exwind.net/zhTW/blue/?game=all"},{"date":"2026-11-08","category":"練等","title":"地城擊殺經驗值提高","body":"地城擊殺經驗值較先前提高50%。","author":"Kaivax","translated":"https://exwind.net/zhTW/blue/?game=all"},{"date":"2026-11-25","category":"職業","title":"平衡德魯伊天賦重整","body":"強化星火術上限降至2點，月怒改為夢境；梟獸形態增加10%秘法與自然傷害。舊版配點須重新核對，尤其曾投入3點以上強化星火術的角色。","author":"Kaivax","translated":"https://exwind.net/zhTW/post/blue/199/"},{"date":"2026-11-25","category":"戰場","title":"奧特蘭克山谷目標與聲望調整","body":"擊殺將軍的獎勵降低，佔領目標與擊敗敵方NPC的聲望提高；長時間對戰額外聲望門檻縮短至20分鐘。","author":"Kaivax","translated":"https://exwind.net/zhTW/post/blue/202/"},{"date":"2026-11-25","category":"團本與物品","title":"地城與裝備修正","body":"哈卡的化身生成問題已修復，黑劍 Blackblade of Shahram 的加速增益只給武器持有人；律法聖契現可影響命令審判。","author":"Kaivax","translated":"https://exwind.net/zhTW/post/blue/203/"},{"date":"2026-11-25","category":"專業與附魔","title":"揭露附魔觸發修正","body":"範圍法術改成每波判定一次，而非每個目標分別觸發；引導法術不再全程受到該附魔影響。","author":"Kaivax","translated":"https://exwind.net/zhTW/post/blue/203/"},{"date":"2026-11-23","category":"專業與附魔","title":"烹飪、工程與製皮修正","body":"數種蚌肉料理的進食效果及分類已校正；工程學迫擊砲重載配方與部分製皮圖樣的學習問題修復。","author":"Kaivax","translated":"https://exwind.net/zhTW/post/blue/194/"},{"date":"2026-11-23","category":"職業","title":"野性德魯伊套裝與其他職業修正","body":"Feralheart 四件套裝修正為5秒內每秒恢復4點能量；另有暗影牧師、毀滅術士及致死打擊天賦修正。","author":"Kaivax","translated":"https://exwind.net/zhTW/post/blue/194/"}];const q=document.getElementById("q"),c=document.getElementById("category"),out=document.getElementById("posts");function el(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e;}function draw(){out.replaceChildren();const list=posts.slice().sort((a,b)=>b.date.localeCompare(a.date)).filter(p=>(!c.value||p.category===c.value)&&q.value.trim().toLowerCase().split(/\s+/).filter(Boolean).every(term=>[p.title,p.body,p.date,p.category,p.author||""].join(" ").toLowerCase().includes(term)));document.getElementById("count").textContent="顯示 "+list.length+" 則繁中摘要";for(const p of list){const a=el("article",""),link=el("a","閱讀官方原文");link.href=p.url;link.target="_blank";link.rel="noopener noreferrer";const head=el("div","","post-head"),avatar=el("span","藍","blue-avatar"),meta=el("div","永恆服 · "+p.date+" · "+p.category+(p.author?" · "+p.author:""),"meta");head.append(avatar,meta);const links=el("div","","source-links");if(p.url)links.append(link);const tr=el("a",p.translated&&p.translated.includes("/post/")?"閱讀 EXWIND 繁中全文":"EXWIND 繁中列表");tr.href=p.translated||"https://exwind.net/zhTW/blue/?game=all";tr.target="_blank";tr.rel="noopener noreferrer";links.append(tr);a.append(head,el("h2",p.title),el("p",p.body),el("p","公會繁中摘要","source-label"),links);out.append(a);}if(!list.length)out.append(el("p","沒有符合搜尋的公告。"));}q.oninput=c.onchange=draw;draw();</script></body></html>
