x 0}.source-reader .reader-content{padding:0 12px 12px}.source-reader iframe{display:block;width:100%;height:clamp(420px,75vh,850px);border:1px solid #344254;border-radius:6px;background:#fff}.list-tools{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}button{font:inherit;color:#c6dfff;background:#1e3045;border:1px solid #52647b;border-radius:6px;padding:6px 12px;cursor:pointer}summary:focus-visible,button:focus-visible{outline:2px solid #a8d1ff;outline-offset:2px}.post-toggle[open]>summary{background:#202c3c}.reader-note{font-size:13px;color:#b6c8dc}.post-meta-block{min-width:0}.post-meta-block .meta{margin-top:3px}@media(max-width:600px){.post-toggle>summary{padding:10px}.post-title{font-size:15px}.source-reader iframe{height:600px}}</style></head><body><script>if(new URLSearchParams(location.search).get("embed")==="1")document.documentElement.classList.add("embedded");</script><main><nav><a href="index.html">← 返回公會資料庫</a><a href="https://worldofwarcraft.blizzard.com/zh-tw/news/24315281" target="_blank" rel="noopener noreferrer">暴雪官方繁中熱修全文</a></nav><h1>永恆官方藍帖</h1><p>EXWIND 繁體中文原站閱讀與公會公告索引</p><div id="live-source"></div><section class="panel"><p class="muted">公會選錄核對日期：2026/11/27。下方摘要預設收合；原站閱讀區直接載入 EXWIND，不複製其翻譯全文。原站是否可嵌入由 EXWIND 決定。</p><nav><a href="https://worldofwarcraft.blizzard.com/zh-tw/news/24315281" target="_blank" rel="noopener noreferrer">官方繁中完整熱修正</a><a href="https://us.forums.blizzard.com/en/wow/t/wow-forever-hotfixes-november-25-2026/2403040/1" target="_blank" rel="noopener noreferrer">官方英文討論串</a><a href="https://exwind.net/zhTW/blue/forever/" target="_blank" rel="noopener noreferrer">EXWIND 繁中藍帖完整列表</a></nav></section><section class="panel filters"><label>搜尋公告<input id="q" type="search" placeholder="職業、技能、日期"></label><label>分類<select id="category"><option value="">全部</option><option>職業</option><option>團本與物品</option><option>客服與系統</option><option>練等</option><option>戰場</option><option>專業與附魔</option></select></label></section><p class="muted">點選單則標題展開，再點一次收合。</p><p id="count" class="muted" role="status"></p><div id="posts"></div><footer class="muted">墓鐘公會用資料庫・非官方網站。翻譯摘要及遊戲名詞仍可能需核對。</footer></main><script>const posts=[{"date":"2026-11-25","category":"職業","title":"德魯伊、獵人及術士修正","body":"颶風最後一次傷害正常結算；修正獵人與術士寵物普通近戰爆擊率異常。平衡德魯伊天賦調整請參閱完整官方原文。","url":"https://us.forums.blizzard.com/en/wow/t/wow-forever-hotfixes-november-25-2026/2403040/1","translated":"https://exwind.net/zhTW/post/blue/203/","author":"Kaivax"},{"date":"2026-11-23","category":"團本與物品","title":"世界增益與武器觸發","body":"切換區域不再移除世界增益，進入團本仍會移除。修正部分技能造成過多武器觸發的問題。","url":"https://news.blizzard.com/en-us/article/24315281/wow-forever-hotfixes-november-23-2026","translated":"https://exwind.net/zhTW/post/blue/194/","author":"Kaivax"},{"date":"2026-11-20","category":"職業","title":"戰鬥盜賊及惡魔術士","body":"劍刃亂舞可使 Shank 傷害命中額外目標；修正惡魔庇護洗掉後仍保留增益的問題。","url":"https://us.forums.blizzard.com/en/wow/t/wow-forever-hotfixes-november-25-2026/2403040/1","translated":"https://exwind.net/zhTW/post/blue/192/","author":"Kaivax"},{"date":"2026-11-19","category":"職業","title":"懲戒騎士雙手武器專精","body":"裝備雙手武器時，雙手武器專精正確強化所有神聖傷害。","url":"https://news.blizzard.com/en-us/article/24315281/wow-forever-hotfixes-november-19-2026","translated":"https://exwind.net/zhTW/post/blue/190/","author":"Kaivax"},{"date":"2026-11-13","category":"職業","title":"命令審判及風怒圖騰","body":"命令審判計為近戰攻擊，其他審判仍為遠程攻擊。風怒圖騰的近戰技能觸發規則修正，副手打擊不觸發。","url":"https://us.forums.blizzard.com/en/wow/t/wow-forever-hotfixes-november-25-2026/2403040/1"},{"date":"2026-11-13","category":"客服與系統","title":"技能訓練費用退款","body":"受11月9日伺服器異常影響而遺失已購技能的玩家，可檢查遊戲信箱是否收到退款。","author":"Kaivax","translated":"https://exwind.net/zhTW/blue/?game=all"},{"date":"2026-11-13","category":"職業","title":"恢復德魯伊、法師及聖騎士熱修","body":"野性痊癒不再允許移動施法，治療係數調高至6.6%；冰霜新星的傷害解除規則修正；命令審判按近戰攻擊處理。","author":"Kaivax","translated":"https://exwind.net/zhTW/post/blue/179/"},{"date":"2026-11-10","category":"客服與系統","title":"拍賣場最低寄售金額調整","body":"最低寄售金額下調至1銅幣，另修正部分郵件寄件人及送達時間異常。","author":"Kaivax","translated":"https://exwind.net/zhTW/blue/?game=all"},{"date":"2026-11-08","category":"練等","title":"地城擊殺經驗值提高","body":"地城擊殺經驗值較先前提高50%。","author":"Kaivax","translated":"https://exwind.net/zhTW/blue/?game=all"},{"date":"2026-11-25","category":"職業","title":"平衡德魯伊天賦重整","body":"強化星火術上限降至2點，月怒改為夢境；梟獸形態增加10%秘法與自然傷害。舊版配點須重新核對，尤其曾投入3點以上強化星火術的角色。","author":"Kaivax","translated":"https://exwind.net/zhTW/post/blue/199/"},{"date":"2026-11-25","category":"戰場","title":"奧特蘭克山谷目標與聲望調整","body":"擊殺將軍的獎勵降低，佔領目標與擊敗敵方NPC的聲望提高；長時間對戰額外聲望門檻縮短至20分鐘。","author":"Kaivax","translated":"https://exwind.net/zhTW/post/blue/202/"},{"date":"2026-11-25","category":"團本與物品","title":"地城與裝備修正","body":"哈卡的化身生成問題已修復，黑劍 Blackblade of Shahram 的加速增益只給武器持有人；律法聖契現可影響命令審判。","author":"Kaivax","translated":"https://exwind.net/zhTW/post/blue/203/"},{"date":"2026-11-25","category":"專業與附魔","title":"揭露附魔觸發修正","body":"範圍法術改成每波判定一次，而非每個目標分別觸發；引導法術不再全程受到該附魔影響。","author":"Kaivax","translated":"https://exwind.net/zhTW/post/blue/203/"},{"date":"2026-11-23","category":"專業與附魔","title":"烹飪、工程與製皮修正","body":"數種蚌肉料理的進食效果及分類已校正；工程學迫擊砲重載配方與部分製皮圖樣的學習問題修復。","author":"Kaivax","translated":"https://exwind.net/zhTW/post/blue/194/"},{"date":"2026-11-23","category":"職業","title":"野性德魯伊套裝與其他職業修正","body":"Feralheart 四件套裝修正為5秒內每秒恢復4點能量；另有暗影牧師、毀滅術士及致死打擊天賦修正。","author":"Kaivax","translated":"https://exwind.net/zhTW/post/blue/194/"}];const q=document.getElementById("q"),c=document.getElementById("category"),out=document.getElementById("posts");
const SOURCE="https://exwind.net/zhTW/blue/forever/",ALL="https://exwind.net/zhTW/blue/?game=all";
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function external(text,url){const a=el("a",text);a.href=url;a.target="_blank";a.rel="noopener noreferrer";return a;}
function reader(label,url,withSelect=false){
 const d=el("details",undefined,"source-reader"),head=el("summary",label),content=el("div",undefined,"reader-content"),holder=el("div"),note=el("p","展開時才連線至 EXWIND。若原站拒絕嵌入或畫面空白，請使用下方原站連結。","reader-note");
 let current=url;const a=external("在新分頁閱讀 EXWIND 原站",current);
 function update(){holder.replaceChildren();if(!d.open||d.closest("article")?.querySelector(".post-toggle")?.open===false)return;const f=el("iframe");f.title="EXWIND 繁體中文原站";f.referrerPolicy="no-referrer";f.loading="lazy";f.src=current;holder.append(f);}
 if(withSelect){const l=el("label","原站分類"),select=el("select");for(const [v,t] of [[SOURCE,"永恆服（EXWIND：無限服）"],[ALL,"全部藍帖"]]){const opt=el("option",t);opt.value=v;select.append(opt);}l.append(select);content.append(l);select.addEventListener("change",()=>{current=select.value;a.href=current;update();});}
 content.append(note,a,holder);d.append(head,content);d.addEventListener("toggle",update);return d;
}
document.getElementById("live-source").append(reader("展開 EXWIND 最新繁中藍帖（直接閱讀原站）",SOURCE,true));
const expanded=new Set();
function draw(){
 out.replaceChildren();
 const terms=q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
 const list=posts.map((p,i)=>({...p,index:i})).sort((a,b)=>b.date.localeCompare(a.date)).filter(p=>(!c.value||p.category===c.value)&&terms.every(term=>[p.title,p.body,p.date,p.category,p.author||""].join(" ").toLowerCase().includes(term)));
 document.getElementById("count").textContent="顯示 "+list.length+" 則繁中摘要";
 for(const p of list){
  const a=el("article"),d=el("details",undefined,"post-toggle"),head=el("summary"),avatar=el("span","藍","blue-avatar"),metaBlock=el("div",undefined,"post-meta-block"),meta=el("div","永恆服 · "+p.date+" · "+p.category+(p.author?" · "+p.author:""),"meta");
  metaBlock.append(el("div",p.title,"post-title"),meta);head.append(avatar,metaBlock);
  const content=el("div",undefined,"post-content"),links=el("div",undefined,"source-links");
  if(p.url)links.append(external("閱讀官方原文",p.url));
  const direct=p.translated&&p.translated.includes("/post/");
  links.append(external(direct?"EXWIND 繁中全文":"EXWIND 永恆藍帖列表",direct?p.translated:SOURCE));
  content.append(el("p","公會繁中摘要","source-label"),el("p",p.body),links);
  const original=direct?reader("展開 EXWIND 繁中全文",p.translated):null;if(original)content.append(original);
  d.append(head,content);d.open=expanded.has(p.index);
  d.addEventListener("toggle",()=>{if(d.open)expanded.add(p.index);else{expanded.delete(p.index);if(original)original.open=false;}});
  a.append(d);out.append(a);
 }
 if(!list.length)out.append(el("p","沒有符合搜尋的公告。"));
}
q.oninput=c.onchange=draw;
draw();</script></body></html>
