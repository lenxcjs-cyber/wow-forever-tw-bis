ain><script>const posts=[{"date":"2026-11-25","category":"職業","title":"德魯伊、獵人及術士修正","body":"颶風最後一次傷害正常結算；修正獵人與術士寵物普通近戰爆擊率異常。平衡德魯伊天賦調整請參閱完整官方原文。","url":"https://us.forums.blizzard.com/en/wow/t/wow-forever-hotfixes-november-25-2026/2403040/1"},{"date":"2026-11-23","category":"團本與物品","title":"世界增益與武器觸發","body":"切換區域不再移除世界增益，進入團本仍會移除。修正部分技能造成過多武器觸發的問題。","url":"https://news.blizzard.com/en-us/article/24315281/wow-forever-hotfixes-november-23-2026"},{"date":"2026-11-20","category":"職業","title":"戰鬥盜賊及惡魔術士","body":"劍刃亂舞可使 Shank 傷害命中額外目標；修正惡魔庇護洗掉後仍保留增益的問題。","url":"https://us.forums.blizzard.com/en/wow/t/wow-forever-hotfixes-november-25-2026/2403040/1"},{"date":"2026-11-19","category":"職業","title":"懲戒騎士雙手武器專精","body":"裝備雙手武器時，雙手武器專精正確強化所有神聖傷害。","url":"https://news.blizzard.com/en-us/article/24315281/wow-forever-hotfixes-november-19-2026"},{"date":"2026-11-13","category":"職業","title":"命令審判及風怒圖騰","body":"命令審判計為近戰攻擊，其他審判仍為遠程攻擊。風怒圖騰的近戰技能觸發規則修正，副手打擊不觸發。","url":"https://us.forums.blizzard.com/en/wow/t/wow-forever-hotfixes-november-25-2026/2403040/1"}];const q=document.getElementById("q"),c=document.getElementById("category"),out=document.getElementById("posts");function el(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e;}function draw(){out.replaceChildren();const list=posts.filter(p=>(!c.value||p.category===c.value)&&[p.title,p.body,p.date,p.category].join(" ").includes(q.value.trim()));document.getElementById("count").textContent="顯示 "+list.length+" 則繁中摘要";for(const p of list){const a=el("article",""),link=el("a","閱讀官方原文");link.href=p.url;link.target="_blank";link.rel="noopener noreferrer";a.append(el("div",p.date+" · "+p.category+" · 公會繁中摘要","meta"),el("h2",p.title),el("p",p.body),link);out.append(a);}if(!list.length)out.append(el("p","沒有符合搜尋的公告。"));}q.oninput=c.onchange=draw;draw();</script></body></html>
