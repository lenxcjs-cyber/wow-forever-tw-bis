# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check guild database regression tests
        run: node tests/guild-tools.test.cjs
      - name: Fetch version-pinned talent client snapshot
        run: |
          if curl --fail --location --retry 2 --connect-timeout 10 --max-time 40 'https://zephras.com/data/forever/enUS/talents/1.60.1.71139.json' -o talent-client.tmp && node -e "const d=JSON.parse(require('fs').readFileSync('talent-client.tmp','utf8'));if(d.build!=='1.60.1.71139'||d.format!=='zephras-talents/1')process.exit(1)"; then
            mv talent-client.tmp talent-client.json
          else
            rm -f talent-client.tmp
            echo "::warning::Talent snapshot unavailable; page will show fallback and existing profiles."
          fi
      - name: Import attributed community talent data
        run: |
          mkdir -p "$RUNNER_TEMP/talents-forever"
          ok=1
          for class in warrior paladin hunter rogue priest shaman mage warlock druid; do
            curl --fail --location --retry 1 --connect-timeout 10 --max-time 30 "https://talentsforever.com/export/$class.json" -o "$RUNNER_TEMP/talents-forever/$class.json" || ok=0
          done
          if test "$ok" = 1 && python3 scripts/import-talents-forever.py "$RUNNER_TEMP/talents-forever" talent-community.json; then
            echo "Community talent snapshot imported"
          else
            rm -f talent-community.json
            echo "::warning::Community snapshot unavailable; preserve partial fallback."
          fi
      - name: Map client talent icons to original WoW textures
        run: |
          input=talent-reference-partial.json
          if test -f talent-client.json; then input=talent-client.json; fi
          if curl --fail --location --retry 1 --connect-timeout 10 --max-time 120 'https://github.com/wowdev/wow-listfile/releases/download/202611251712/verified-listfile.csv' -o /tmp/wow-listfile.csv; then
            if ! python3 scripts/map-talent-icons.py "$input" /tmp/wow-listfile.csv talent-icons.json; then
              echo "::warning::Icon mapping failed; using fallback."
            fi
          else
            echo "::warning::Original texture mapping unavailable; fallback symbols remain."
          fi
          if test -f talent-icons.json; then
            node -e 'const d=require("./talent-icons.json");console.log("Original texture IDs mapped:",Object.keys(d).filter(k=>/^[0-9]+$/.test(k)).length)'
          fi
      - name: Check independent talent page and leveling routes
        run: node tests/talents-page.test.cjs
      - name: Report actual talent data availability
        run: |
          if test -f talent-client.json; then
            echo '### Talent snapshot: available; real-data tests ran' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Talent snapshot: unavailable; real-data tests skipped' >> "$GITHUB_STEP_SUMMARY"
            echo 'Site deployed in fallback mode. Do not mark 459 leveling steps as verified.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Import all-source equipment catalog (optional)
        run: |
          base='https://gblaku.github.io/wow-forever-kb/api'
          dir="$RUNNER_TEMP/gear-catalog"
          mkdir -p "$dir"
          if curl -fsSL --connect-timeout 8 --max-time 45 "$base/items.json" -o "$dir/items.json" && curl -fsSL --connect-timeout 8 --max-time 20 "$base/proficiency.json" -o "$dir/proficiency.json" && curl -fsSL --connect-timeout 8 --max-time 20 "$base/meta.json" -o "$dir/meta.json"; then
            if python3 -c 'import json,sys; from pathlib import Path; p=Path(sys.argv[1]); d={k:json.loads((p/f"{f}.json").read_text()) for k,f in [("items","items"),("prof","proficiency"),("meta","meta")]}; assert isinstance(d["items"],list) and len(d["items"])>1000 and len(d["prof"])>=9 and d["meta"].get("client_build"); d["items"]=[i for i in d["items"] if i.get("item_class") in ("Weapon","Armor") and i.get("slot")!="Non-equippable"]; Path("gear-catalog.json").write_text(json.dumps(d,ensure_ascii=False,separators=(",",":"))); print("Catalog equippable records:",len(d["items"]),"build:",d["meta"]["client_build"])' "$dir"; then
              echo "All-source catalog snapshot available"
            else
              rm -f gear-catalog.json
              echo "::warning::Equipment data schema changed; existing candidates and external link remain."
            fi
          else
            echo "::warning::Equipment catalog unavailable at publish time; page can retry the public API."
          fi
      - name: Stamp homepage asset versions
        run: python3 scripts/stamp-assets.py
      - name: Install browser test dependency
        id: browser_setup
        continue-on-error: true
        run: npm install --prefix "$RUNNER_TEMP/guild-browser" --no-save --no-package-lock playwright@1.57.0
      - name: Run real browser smoke checks
        if: steps.browser_setup.outcome == 'success'
        run: |
          export NODE_PATH="$RUNNER_TEMP/guild-browser/node_modules"
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          if test -z "$CHROME_PATH"; then
            "$RUNNER_TEMP/guild-browser/node_modules/.bin/playwright" install chromium
          fi
          node tests/browser-smoke.cjs
      - name: Report skipped browser tests
        if: steps.browser_setup.outcome != 'success'
        run: echo "::warning::Browser dependency installation unavailable; browser tests skipped."
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
