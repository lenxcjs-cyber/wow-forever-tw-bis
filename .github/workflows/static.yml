# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check guild database regression tests
        run: node tests/guild-tools.test.cjs
      - name: Check native combat preset generator offline
        run: python3 tests/test-combat-presets.py
      - name: Fetch version-pinned talent client snapshot
        run: |
          if curl --fail --location --retry 2 --connect-timeout 10 --max-time 40 'https://zephras.com/data/forever/enUS/talents/1.60.1.71139.json' -o talent-client.tmp && node -e "const d=JSON.parse(require('fs').readFileSync('talent-client.tmp','utf8'));if(d.build!=='1.60.1.71139'||d.format!=='zephras-talents/1')process.exit(1)"; then
            mv talent-client.tmp talent-client.json
          else
            rm -f talent-client.tmp
            echo "::warning::Talent snapshot unavailable; page will show fallback and existing profiles."
          fi
      - name: Import attributed community talent data
        run: |
          mkdir -p "$RUNNER_TEMP/talents-forever"
          ok=1
          for class in warrior paladin hunter rogue priest shaman mage warlock druid; do
            curl --fail --location --retry 1 --connect-timeout 10 --max-time 30 "https://talentsforever.com/export/$class.json" -o "$RUNNER_TEMP/talents-forever/$class.json" || ok=0
          done
          if test "$ok" = 1 && python3 scripts/import-talents-forever.py "$RUNNER_TEMP/talents-forever" talent-community.json; then
            echo "Community talent snapshot imported"
          else
            rm -f talent-community.json
            echo "::warning::Community snapshot unavailable; preserve partial fallback."
          fi
      - name: Map client talent icons to original WoW textures
        run: |
          input=talent-reference-partial.json
          if test -f talent-client.json; then input=talent-client.json; fi
          if curl --fail --location --retry 1 --connect-timeout 10 --max-time 120 'https://github.com/wowdev/wow-listfile/releases/download/202611251712/verified-listfile.csv' -o /tmp/wow-listfile.csv; then
            if ! python3 scripts/map-talent-icons.py "$input" /tmp/wow-listfile.csv talent-icons.json; then
              echo "::warning::Icon mapping failed; using fallback."
            fi
          else
            echo "::warning::Original texture mapping unavailable; fallback symbols remain."
          fi
          if test -f talent-icons.json; then
            node -e 'const d=require("./talent-icons.json");console.log("Original texture IDs mapped:",Object.keys(d).filter(k=>/^[0-9]+$/.test(k)).length)'
          fi
      - name: Map version-matched original equipment icons
        run: |
          dir="$RUNNER_TEMP/item-appearance"
          mkdir -p "$dir"
          python3 tests/test-item-icons.py
          if test -s /tmp/wow-listfile.csv; then
            for table in Item ItemAppearance ItemModifiedAppearance; do
              curl -fsSL --connect-timeout 8 --max-time 40 "https://wago.tools/db2/$table/csv?build=1.60.1.71139" -o "$dir/$table.csv" || rm -f "$dir/$table.csv"
            done
          fi
          if test -s /tmp/wow-listfile.csv && python3 scripts/map-item-icons.py "$dir" /tmp/wow-listfile.csv item-icons.json 1.60.1.71139; then
            echo "Original item icon map generated"
          else
            rm -f item-icons.json
            echo "::warning::Item icon mapping unavailable; equipment names remain usable."
          fi
      - name: Check independent talent page and leveling routes
        run: node tests/talents-page.test.cjs
      - name: Report actual talent data availability
        run: |
          if test -f talent-client.json; then
            echo '### Talent snapshot: available; real-data tests ran' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Talent snapshot: unavailable; real-data tests skipped' >> "$GITHUB_STEP_SUMMARY"
            echo 'Site deployed in fallback mode. Do not mark 459 leveling steps as verified.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Import all-source equipment catalog (optional)
        run: |
          base='https://gblaku.github.io/wow-forever-kb/api'
          dir="$RUNNER_TEMP/gear-catalog"
          mkdir -p "$dir"
          if curl -fsSL --connect-timeout 8 --max-time 45 "$base/items.json" -o "$dir/items.json" && curl -fsSL --connect-timeout 8 --max-time 20 "$base/proficiency.json" -o "$dir/proficiency.json" && curl -fsSL --connect-timeout 8 --max-time 20 "$base/meta.json" -o "$dir/meta.json"; then
            if python3 -c 'import json,sys; from pathlib import Path; p=Path(sys.argv[1]); d={k:json.loads((p/f"{f}.json").read_text()) for k,f in [("items","items"),("prof","proficiency"),("meta","meta")]}; assert isinstance(d["items"],list) and len(d["items"])>1000 and len(d["prof"])>=9 and d["meta"].get("client_build"); d["items"]=[i for i in d["items"] if i.get("item_class") in ("Weapon","Armor") and i.get("slot")!="Non-equippable"]; Path("gear-catalog.json").write_text(json.dumps(d,ensure_ascii=False,separators=(",",":"))); print("Catalog equippable records:",len(d["items"]),"build:",d["meta"]["client_build"])' "$dir"; then
              echo "All-source catalog snapshot available"
            else
              rm -f gear-catalog.json
              echo "::warning::Equipment data schema changed; existing candidates and external link remain."
            fi
          else
            echo "::warning::Equipment catalog unavailable at publish time; page can retry the public API."
          fi
      - name: Import official zhTW client names
        run: |
          dir="$RUNNER_TEMP/zh-tw-client"
          mkdir -p "$dir"
          build=1.60.1.71139
          for entry in 'ItemSparse:zhTW:items-zhTW' 'SpellName:enUS:spells-enUS' 'SpellName:zhTW:spells-zhTW' 'Spell:enUS:effects-enUS' 'Spell:zhTW:effects-zhTW'; do
            IFS=: read -r table locale file <<< "$entry"
            curl -fsSL --connect-timeout 8 --max-time 40 "https://wago.tools/db2/$table/csv?build=$build&locale=$locale" -o "$dir/$file.csv" || rm -f "$dir/$file.csv"
          done
          python3 scripts/build-locale.py "$dir" "$build"
          python3 tests/test-guide-spells.py
          for table in SkillLineAbility SpellLevels SpellCooldowns; do
            curl -fsSL --connect-timeout 8 --max-time 40 "https://wago.tools/db2/$table/csv?build=$build" -o "$dir/$table.csv" || rm -f "$dir/$table.csv"
          done
          if ! python3 scripts/map-guide-spells.py "$dir" "$build" skill-client.json; then
            rm -f skill-client.json
            echo "::warning::Class-matched skill metadata unavailable; authored guides remain available."
          fi
      - name: Generate version-pinned native combat presets
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/wowsims-presets"
          mkdir -p "$work/bin" "$work/source"
          curl -fsSL --retry 1 --connect-timeout 10 --max-time 60 'https://github.com/wowsims/forever/releases/download/v1.0.12/wowsimcli_linux_amd64.zip' -o "$work/cli.zip"
          echo "917bfcd8d046c5738040e63508b55c16b8ad63e2bb306f49b7052191dc96a009  $work/cli.zip" | sha256sum -c -
          unzip -q "$work/cli.zip" -d "$work/bin"
          cli="$(find "$work/bin" -type f -name 'wowsimcli*' -print -quit)"
          test -n "$cli"
          chmod +x "$cli"
          git -C "$work/source" init -q
          git -C "$work/source" remote add origin https://github.com/wowsims/forever.git
          git -C "$work/source" sparse-checkout init --cone
          git -C "$work/source" sparse-checkout set ui/specs ui/features/settings/model sim
          git -C "$work/source" fetch --depth=1 --filter=blob:none origin 3b9c125a9b1387cd53ce2bb12969e0c6b54b813e
          git -C "$work/source" checkout --detach FETCH_HEAD
          test "$(git -C "$work/source" rev-parse HEAD)" = "3b9c125a9b1387cd53ce2bb12969e0c6b54b813e"
          python3 scripts/build-set-effects.py "$work/source" set-effects.json 3b9c125a9b1387cd53ce2bb12969e0c6b54b813e || echo "::warning::Set activation snapshot unavailable"
          python3 scripts/build-ep-presets.py "$work/source" ep-presets.json 3b9c125a9b1387cd53ce2bb12969e0c6b54b813e || echo "::warning::Pinned EP snapshot unavailable"
          python3 scripts/run-combat-presets.py "$cli" "$work/source" combat-presets.json
      - name: Run native guild set-versus-scatter threshold trials
        continue-on-error: true
        timeout-minutes: 14
        run: |
          work="$RUNNER_TEMP/wowsims-presets"
          cli="$(find "$work/bin" -type f -name 'wowsimcli*' -print -quit)"
          if test -n "$cli" && test -s combat-presets.json && test -s set-effects.json && test -s gear-catalog.json; then
            python3 scripts/run-set-trials.py "$cli" "$work/source" .
          else
            echo "::warning::Required native or item-set data unavailable; no simulated set rankings."
          fi
      - name: Install Go for in-site native browser engine
        id: wasm_go
        continue-on-error: true
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build and smoke-test same-origin WebAssembly engine
        if: steps.wasm_go.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/tomb-wasm-source"
          mkdir -p "$root"
          git -C "$root" init -q
          git -C "$root" remote add origin https://github.com/wowsims/forever.git
          git -C "$root" sparse-checkout init --cone
          git -C "$root" sparse-checkout set sim proto assets/database ui/worker
          git -C "$root" fetch --depth=1 --filter=blob:none origin 3b9c125a9b1387cd53ce2bb12969e0c6b54b813e
          git -C "$root" checkout --detach FETCH_HEAD
          command -v protoc || sudo apt-get update && command -v protoc || sudo apt-get install -y protobuf-compiler
          bash scripts/build-browser-engine.sh . "$root"
      - name: Report actual browser-engine availability
        run: |
          if test -s native-engine/manifest.json; then
            echo '### Browser native engine: real WASM smoke passed' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Browser native engine: unavailable; do not show a successful native execution state' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stamp homepage asset versions
        run: python3 scripts/stamp-assets.py
      - name: Install browser test dependency
        id: browser_setup
        continue-on-error: true
        run: npm install --prefix "$RUNNER_TEMP/guild-browser" --no-save --no-package-lock playwright@1.57.0
      - name: Run real browser smoke checks
        if: steps.browser_setup.outcome == 'success'
        run: |
          export NODE_PATH="$RUNNER_TEMP/guild-browser/node_modules"
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          if test -z "$CHROME_PATH"; then
            "$RUNNER_TEMP/guild-browser/node_modules/.bin/playwright" install chromium
          fi
          node tests/browser-smoke.cjs
      - name: Report skipped browser tests
        if: steps.browser_setup.outcome != 'success'
        run: echo "::warning::Browser dependency installation unavailable; browser tests skipped."
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Verify Pages artifact is visible before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' || echo 0)
            if test "$count" = 1; then
              echo "Pages artifact visible via API; allowing propagation before deployment"
              sleep 15
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages artifact still not visible after upload"
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
